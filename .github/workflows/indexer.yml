name: Indexer CI

on:
  push:
    branches: [main]
    paths:
      - "tools/indexer/**"
      - ".github/workflows/indexer.yml"
  pull_request:
    paths:
      - "tools/indexer/**"
      - ".github/workflows/indexer.yml"

permissions:
  contents: read

jobs:
  indexer:
    name: tools/indexer checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/indexer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/indexer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
