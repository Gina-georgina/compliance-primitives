name: Publish pausable to crates.io

# compliance-pausable is the one crate in this workspace meant to be
# consumed as an ordinary Rust dependency by other Soroban projects (every
# other crate here is a Soroban contract, published as wasm, not as a Rust
# library). Publication is opt-in rather than automatic on every merge to
# main — see contracts/pausable/README.md#publishing-to-cratesio for why.
#
# Trigger by pushing a tag matching `pausable-v*` (e.g. `pausable-v0.1.0`),
# or by running this workflow manually from the Actions tab.
on:
  push:
    tags:
      - "pausable-v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish -p compliance-pausable
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#pausable-v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "compliance-pausable") | .version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "error: tag pausable-v${tag_version} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - name: Dry-run package
        run: cargo publish -p compliance-pausable --dry-run

      - name: Publish to crates.io
        run: cargo publish -p compliance-pausable --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
