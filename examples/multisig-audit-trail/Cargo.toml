[package]
name = "multisig-audit-trail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Example demonstrating multisig-admin governance events recorded to audit-log."
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
multisig-admin = { path = "../../contracts/multisig-admin", features = ["testutils"] }
audit-log = { path = "../../contracts/audit-log", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
