[package]
name = "compliance-integration-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration example composing jurisdiction-flag, policy-engine, compliance-aggregator, multisig-admin, circuit-breaker, and audit-log in one transfer flow (#218)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag", features = ["testutils"] }
policy-engine = { path = "../../contracts/policy-engine", features = ["testutils"] }
compliance-aggregator = { path = "../../contracts/compliance-aggregator", features = ["testutils"] }
multisig-admin = { path = "../../contracts/multisig-admin", features = ["testutils"] }
circuit-breaker = { path = "../../contracts/circuit-breaker", features = ["testutils"] }
audit-log = { path = "../../contracts/audit-log", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
