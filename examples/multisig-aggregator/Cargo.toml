[package]
name = "multisig-aggregator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
multisig-admin = { path = "../../contracts/multisig-admin" }
compliance-aggregator = { path = "../../contracts/compliance-aggregator" }
denylist-gate = { path = "../../contracts/denylist-gate" }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag" }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
